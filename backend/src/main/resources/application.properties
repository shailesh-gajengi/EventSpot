# Server Configuration (Render/Cloud $PORT support with local fallback)
server.port=${PORT:${SERVER_PORT:8080}}

# Response Compression for fast network payload transfer
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# PostgreSQL Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/eventhosting_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Admin Credentials for testing approval workflow
app.admin.email=admin@eventhosting.com
app.admin.password=admin123

# Mail Provider Selection: "smtp" (for Gmail, no domain needed) or "resend"
mail.provider=${MAIL_PROVIDER:smtp}
mail.from.name=EventSpot

# Gmail SMTP Configuration (Sends to ANY artist email without domain verification)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:shaileshgajengi@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Resend Transactional Email Configuration
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:EventSpot <onboarding@resend.dev>}
resend.base-url=https://api.resend.com

# Brevo HTTPS REST API Configuration (Sends to ANY email via Port 443 - works on Render Free Tier)
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-name=${BREVO_SENDER_NAME:EventSpot}
brevo.sender-email=${BREVO_SENDER_EMAIL:shaileshgajengi@gmail.com}
brevo.base-url=https://api.brevo.com/v3
